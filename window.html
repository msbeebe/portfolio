<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The View Outside | Madeline Beebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medNavyTeal: '#0d1b2a', 
                        medIce: '#B9D6E5',
                        medPlum: '#4E3A53',
                        medOlive: '#698F3D',
                        medPistachio: '#D6E685',
                        medRose: '#D06D9C',
                        medCream: '#F5EDB9',
                        medWood: '#3e2723',
                        medDarkWood: '#251613'
                    },
                    fontFamily: { medieval: ['"MedievalSharp"', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'MedievalSharp', cursive; 
            margin: 0;
            background-color: #4E3A53;
            background-image: radial-gradient(circle at center, #4E3A53 0%, #1a1423 100%);
        }

        .glow-ice { text-shadow: 0 0 10px rgba(185, 214, 229, 0.8); }
        
        /* The Endless Parchment */
        .parchment-scroll {
            background-color: #F5EDB9;
            border-left: 8px solid #8c5a35;
            border-right: 8px solid #8c5a35;
            border-top: 16px solid #3e2723;
            border-bottom: 16px solid #3e2723;
            box-shadow: inset 0 0 40px rgba(62, 39, 35, 0.1), 0 10px 30px rgba(0,0,0,0.6);
            color: #251613;
        }

        /* Desktop Borders */
        @media (min-width: 768px) {
            .parchment-scroll {
                border-left-width: 16px;
                border-right-width: 16px;
                border-top-width: 32px;
                border-bottom-width: 32px;
                box-shadow: inset 0 0 60px rgba(62, 39, 35, 0.2), 0 20px 50px rgba(0,0,0,0.8);
            }
        }

        /* Custom Photo Frames */
        .photo-frame {
            border: 4px solid #3e2723;
            box-shadow: 0 10px 15px rgba(0,0,0,0.4);
            background-color: #251613; 
        }
    </style>
</head>
<body class="text-medCream min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Navigation Header -->
    <div class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center mb-6 px-2 gap-4">
        <a href="index.html" class="text-medIce hover:text-medPistachio text-lg transition-colors flex items-center gap-2">
            ← Return to Study
        </a>
        <div class="text-xl md:text-2xl text-medCream glow-ice tracking-widest uppercase text-center">
            Madeline Beebe
        </div>
    </div>

    <!-- THE CHRONICLER's PARCHMENT -->
    <div class="w-full max-w-5xl parchment-scroll rounded-sm p-4 md:p-12 mb-12">
        
        <!-- Page Title -->
        <div class="text-center border-b-4 border-medWood/30 pb-6 mb-10">
            <h1 class="text-3xl md:text-5xl text-medWood tracking-widest uppercase mb-2">The View Outside</h1>
            <p class="text-base md:text-lg text-medWood/70 italic">A visual archive of the realms beyond the citadel walls.</p>
        </div>

        <!-- THE GALLERY GRID -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">

            <!-- Horizontal 1 -->
            <div class="relative group col-span-1 md:col-span-2 lg:col-span-2 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Hor1.jpg" alt="Hor1" decoding="async" class="w-full h-full object-cover aspect-video transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

            <!-- Vertical 1 -->
            <div class="relative group col-span-1 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Vert1.jpg" alt="Vert1" decoding="async" class="w-full h-full object-cover aspect-[3/4] transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

            <!-- Vertical 2 -->
            <div class="relative group col-span-1 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Vert2.jpg" alt="Vert2" decoding="async" class="w-full h-full object-cover aspect-[3/4] transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

            <!-- Horizontal 2 -->
            <div class="relative group col-span-1 md:col-span-2 lg:col-span-2 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Hor2.jpg" alt="Hor2" decoding="async" class="w-full h-full object-cover aspect-video transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

            <!-- Horizontal 3 -->
            <div class="relative group col-span-1 md:col-span-2 lg:col-span-2 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Hor3.jpg" alt="Hor3" decoding="async" class="w-full h-full object-cover aspect-video transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

            <!-- Vertical 3 -->
            <div class="relative group col-span-1 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Vert3.jpg" alt="Vert3" decoding="async" class="w-full h-full object-cover aspect-[3/4] transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

            <!-- Horizontal 4 -->
            <div class="relative group col-span-1 md:col-span-2 lg:col-span-2 overflow-hidden photo-frame rounded-sm cursor-default">
                <img src="assets/Hor4.jpg" alt="Hor4" decoding="async" class="w-full h-full object-cover aspect-video transition-transform duration-700 group-hover:scale-[1.02]">
            </div>

        </div>
        
        <!-- End of Gallery Message -->
        <div class="mt-12 pt-8 border-t-2 border-dashed border-medWood/20 text-center">
            <p class="text-medWood/60 italic">The archives are continuously expanding...</p>
        </div>

    </div>
</body>
</html>
