<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madeline Beebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medNavyTeal: '#0d1b2a', 
                        medIce: '#B9D6E5',
                        medPlum: '#4E3A53',
                        medOlive: '#698F3D',
                        medPistachio: '#D6E685',
                        medRose: '#D06D9C',
                        medCream: '#F5EDB9',
                        medWood: '#3e2723',
                        medSlate: '#868884'
                    },
                    fontFamily: { medieval: ['"MedievalSharp"', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'MedievalSharp', cursive; 
            margin: 0;
            overflow-x: hidden; 
            background-color: #4E3A53;
        }

        .glow-pistachio { text-shadow: 0 0 10px rgba(214, 230, 133, 0.8); }
        .glow-rose { text-shadow: 0 0 10px rgba(208, 109, 156, 0.8); box-shadow: 0 0 15px rgba(208, 109, 156, 0.6); }
        .glow-ice { text-shadow: 0 0 10px rgba(185, 214, 229, 0.8); }
        .box-glow { box-shadow: 0 0 30px rgba(13, 27, 42, 0.8); }
        .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
        
        .room-wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 65%;
            background: linear-gradient(to bottom, #0d1b2a, #1a2f3a);
            border-bottom: 8px solid #15242b;
            z-index: 1;
        }
        .room-floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background: linear-gradient(to bottom, #3e2723, #251613);
            z-index: 1;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.6);
        }

        .room-object {
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .room-object:hover {
            transform: scale(1.10) translateY(-3px);
            filter: drop-shadow(0 0 15px rgba(214,230,133,0.6));
        }
        
        /* Mobile-First Object Tooltips */
        .room-object span {
            opacity: 0;
            transition: opacity 0.3s;
            margin-top: 2px;
            background-color: rgba(13, 27, 42, 0.9);
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #D6E685;
            white-space: nowrap;
            pointer-events: none;
            color: #D6E685;
            font-size: 0.55rem;
            position: relative;
            z-index: 100;
        }
        .room-object:hover span { opacity: 1; }

        @media (min-width: 768px) {
            .room-object span {
                padding: 4px 8px;
                font-size: 0.875rem;
                margin-top: 4px;
            }
        }

        @keyframes goldPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(214,230,133,1); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
        }
        .animate-pulse-gold { animation: goldPulse 0.5s ease-out; }
    </style>
</head>
<body class="text-medCream min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- CENTERED NAME (Above Diorama) -->
    <div class="w-full text-center mt-6 md:mt-2 mb-4">
        <h1 class="text-3xl md:text-5xl text-medCream glow-ice tracking-widest uppercase">Madeline Beebe</h1>
    </div>

    <!-- MAIN DIORAMA WRAPPER -->
    <div class="relative w-full max-w-5xl mx-auto mt-4 md:mt-8 mb-8">
        
        <!-- ROOM BOX: Uses a taller 4:3 box on phones for vertical space, 16:9 on desktop -->
        <div class="relative w-full aspect-[4/3] md:aspect-[16/9] bg-medNavyTeal border-4 md:border-8 border-medOlive rounded-xl md:rounded-2xl box-glow overflow-hidden">
    
            <div class="room-wall"></div>
            <div class="room-floor"></div>

            <!-- HIDDEN PERSONA BOX (Appears on Avatar Tap) -->
            <div id="persona-box" class="absolute top-2 right-2 md:top-auto md:bottom-6 md:right-6 z-[100] bg-medNavyTeal/95 border-2 md:border-4 border-medPistachio p-2 md:p-4 rounded-md md:rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.9)] w-40 md:w-80 opacity-0 pointer-events-none transition-opacity duration-300">
                <h1 class="text-[0.6rem] md:text-xl text-medPistachio glow-pistachio mb-1 md:mb-2 border-b border-medIce/30 pb-1 md:pb-2">Magister Madeline Beebe</h1>
                <div class="grid grid-cols-2 gap-1 md:gap-2 text-[0.5rem] md:text-sm text-medCream leading-tight">
                    <p><span class="text-medIce">Class:</span> Scholar</p>
                    <p><span class="text-medIce">Rank:</span> Magister</p>
                    <p class="col-span-2"><span class="text-medIce">Materia:</span> Cosmonautics & Analytics</p>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- RIGHT QUADRANT                             -->
            <!-- ========================================== -->
            <img src="assets/New_Window.png" alt="Window" class="absolute pointer-events-none w-20 md:w-56 pixelated z-10 opacity-90 top-[5%] right-[5%] md:top-[24%] md:right-[14%]">
            
            <a href="skills.html" class="absolute room-object z-[55] top-[25%] right-[2%] md:top-auto md:bottom-[16%] md:-right-[3%]">
                <img src="assets/Bookshelf.png" alt="Bookshelf" class="w-16 md:w-56 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                <span class="-mt-2 md:-mt-5">Skill Tree</span>
            </a>
            
            <a href="campaign.html" class="absolute room-object z-[50] bottom-[5%] right-[10%] md:bottom-[2%] md:right-auto md:left-[60%]">
                <img src="assets/Spellbook_Pedestal.png" alt="Spellbook" class="w-14 md:w-48 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                <span class="-mt-2 md:-mt-5">Campaign Log</span>
            </a>

            <!-- ========================================== -->
            <!-- LEFT QUADRANT                              -->
            <!-- ========================================== -->
            <a href="map.html" class="absolute room-object z-[75] top-[5%] left-[5%] md:top-[20%] md:left-[5%]">
                <img src="assets/Wall_Map.png" alt="Map" class="w-14 md:w-40 pixelated drop-shadow-xl">
                <span>Overworld Map</span>
            </a>
            
            <a href="sidequests.html" class="absolute room-object z-[55] top-[30%] left-[10%] md:top-[15%] md:left-[20%]">
                <img src="assets/Quest_Board.png" alt="Quest Board" class="w-10 md:w-36 pixelated drop-shadow-xl">
                <span class="-mt-2 md:-mt-5">Side Quests</span>
            </a>
            
            <a href="inventory.html" class="absolute room-object z-[55] bottom-[8%] left-[12%] md:bottom-[16%] md:left-[24%] md:-translate-x-1/2">
                <img src="assets/Wooden_Chest.png" alt="Chest" class="w-16 md:w-40 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                <span>Artifact Inventory</span>
            </a>

            <!-- ========================================== -->
            <!-- CENTER QUADRANT                            -->
            <!-- ========================================== -->
            <img src="assets/Lantern.png" alt="Lantern" class="absolute pointer-events-none w-5 md:w-16 pixelated z-10 animate-pulse drop-shadow-[0_0_15px_rgba(245,237,185,0.6)] top-[15%] left-[38%] md:top-[20%] -translate-x-1/2">
            
            <img src="assets/Lantern.png" alt="Lantern" class="absolute pointer-events-none w-5 md:w-16 pixelated z-10 animate-pulse drop-shadow-[0_0_15px_rgba(245,237,185,0.6)] top-[15%] left-[62%] md:top-[20%] -translate-x-1/2">

            <!-- FOCAL POINT: AVATAR -->
            <div class="absolute z-[40] flex justify-center w-24 h-24 md:w-72 md:h-72 cursor-pointer transition-all duration-300 hover:drop-shadow-[0_0_20px_rgba(214,230,133,0.8)] bottom-[20%] left-1/2 md:bottom-[25%] -translate-x-1/2" onmouseenter="togglePersona(true)" onmouseleave="togglePersona(false)" onclick="togglePersona(true)">
                <img src="assets/Main_Avatar.png" alt="Main Avatar" class="w-full h-full object-contain pixelated drop-shadow-[0_15px_15px_rgba(0,0,0,0.6)]">
                
                <div id="lvl-badge" class="absolute top-1 right-2 md:top-8 md:right-12 bg-medRose text-medCream border border-medCream rounded px-1 py-0 md:px-2 md:py-0.5 text-[0.5rem] md:text-sm font-bold glow-rose z-50 pointer-events-none shadow-md opacity-0 transition-opacity duration-300">
                    LVL 5
                </div>
            </div>

            <!-- THE DESK -->
            <a href="academy.html" class="absolute room-object z-[60] bottom-[-2%] left-1/2 md:bottom-[-8%] -translate-x-1/2">
                <img src="assets/Heavy_Desk.png" alt="Heavy Desk" class="w-36 md:w-80 pixelated drop-shadow-[0_15px_15px_rgba(0,0,0,0.9)]">
                <span class="absolute bottom-[20%]">The Academy</span>
            </a>
            
        </div>
    </div>

    <footer class="mt-4 pb-12 text-center w-full px-4">
        <p class="text-medPistachio text-sm md:text-2xl tracking-widest glow-pistachio uppercase leading-relaxed">
            driving directive: leverage skills to become a realm force for good
        </p>
    </footer>

    <script>
        function togglePersona(show) {
            const personaBox = document.getElementById('persona-box');
            const lvlBadge = document.getElementById('lvl-badge');
            if (show) {
                personaBox.classList.remove('opacity-0');
                personaBox.classList.add('opacity-100');
                lvlBadge.classList.remove('opacity-0');
                lvlBadge.classList.add('opacity-100');
            } else {
                personaBox.classList.add('opacity-0');
                personaBox.classList.remove('opacity-100');
                lvlBadge.classList.add('opacity-0');
                lvlBadge.classList.remove('opacity-100');
            }
        }
    </script>
</body>
</html>
