<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifact Inventory | Madeline Beebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medNavyTeal: '#0d1b2a', 
                        medIce: '#B9D6E5',
                        medPlum: '#4E3A53',
                        medOlive: '#698F3D',
                        medPistachio: '#D6E685',
                        medRose: '#D06D9C',
                        medCream: '#F5EDB9',
                        medWood: '#3e2723',
                        medDarkWood: '#251613'
                    },
                    fontFamily: { medieval: ['"MedievalSharp"', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'MedievalSharp', cursive; 
            margin: 0;
            overflow-x: hidden; 
            background-color: #4E3A53;
        }

        .glow-pistachio { text-shadow: 0 0 10px rgba(214, 230, 133, 0.8); }
        .glow-ice { text-shadow: 0 0 10px rgba(185, 214, 229, 0.8); }
        .box-glow { box-shadow: 0 0 30px rgba(13, 27, 42, 0.8); }
        .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
        
        /* Diorama Background */
        .room-wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 65%;
            background: linear-gradient(to bottom, #0d1b2a, #1a2f3a);
            border-bottom: 8px solid #15242b;
            z-index: 1;
        }
        .room-floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background: linear-gradient(to bottom, #3e2723, #251613);
            z-index: 1;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Inventory Slots */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 12px;
            padding: 16px;
            background-color: rgba(13, 27, 42, 0.8);
            border: 4px solid #3e2723;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            overflow-y: auto;
        }
        .inv-slot {
            width: 64px; height: 64px;
            background-color: #1a2f3a;
            border: 2px solid #251613;
            border-bottom-color: #5a3b34;
            border-right-color: #5a3b34;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .inv-slot:hover, .inv-slot.active {
            background-color: #2a4b5e;
            border-color: #D6E685;
            box-shadow: 0 0 10px rgba(214, 230, 133, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
            transform: scale(1.05);
        }
        
        /* Inspector Panel */
        .inspector-panel {
            background-color: #F5EDB9;
            border: 6px solid #3e2723;
            box-shadow: 0 15px 25px rgba(0,0,0,0.7), inset 0 0 30px rgba(140, 90, 53, 0.2);
            color: #251613;
        }

        /* Custom Scrollbar for Grid */
        .inventory-grid::-webkit-scrollbar { width: 8px; }
        .inventory-grid::-webkit-scrollbar-track { background: #1a2f3a; }
        .inventory-grid::-webkit-scrollbar-thumb { background: #3e2723; border-radius: 4px; }
        .inventory-grid::-webkit-scrollbar-thumb:hover { background: #5a3b34; }

        @keyframes goldPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(214,230,133,1); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
        }
        .animate-pulse-gold { animation: goldPulse 0.5s ease-out; }
    </style>
</head>
<body class="text-medCream min-h-screen p-4 md:p-8 flex flex-col items-center" onload="initInventory()">

    <!-- CENTERED NAME (Above Diorama) -->
    <div class="w-full text-center mt-6 md:mt-2 mb-4">
        <h1 class="text-4xl md:text-5xl text-medCream glow-ice tracking-widest uppercase">Madeline Beebe</h1>
    </div>

    <div class="relative w-full max-w-5xl mx-auto mb-8">
        
        <a href="index.html" class="absolute -top-12 left-4 z-50 text-medIce hover:text-medPistachio text-lg transition-colors flex items-center gap-2">
            ← Return to Study
        </a>

        <!-- MAIN DIORAMA BOX -->
        <div class="relative w-full aspect-square md:aspect-[16/9] border-8 border-medOlive rounded-2xl box-glow overflow-hidden">
            
            <div class="room-wall"></div>
            <div class="room-floor"></div>

            <div class="absolute top-4 w-full text-center z-10 pointer-events-none">
                <h1 class="text-2xl md:text-3xl text-medPistachio glow-pistachio tracking-widest uppercase">Artifact Inventory</h1>
            </div>

            <!-- INVENTORY UI OVERLAY -->
            <div class="absolute inset-0 z-20 flex flex-col md:flex-row p-6 md:p-12 pt-16 md:pt-20 gap-6 h-full">
                
                <!-- LEFT: The Item Grid -->
                <div class="w-full md:w-3/5 h-48 md:h-full inventory-grid" id="grid-container">
                    <!-- Slots will be injected here by JavaScript -->
                </div>

                <!-- RIGHT: The Inspector Panel -->
                <div class="w-full md:w-2/5 h-full inspector-panel rounded-lg p-6 flex flex-col items-center text-center relative">
                    
                    <!-- Decorative Corners -->
                    <div class="absolute top-2 left-2 w-3 h-3 border-t-2 border-l-2 border-medWood"></div>
                    <div class="absolute top-2 right-2 w-3 h-3 border-t-2 border-r-2 border-medWood"></div>
                    <div class="absolute bottom-2 left-2 w-3 h-3 border-b-2 border-l-2 border-medWood"></div>
                    <div class="absolute bottom-2 right-2 w-3 h-3 border-b-2 border-r-2 border-medWood"></div>

                    <!-- Dynamic Content -->
                    <div id="inspector-icon" class="w-24 h-24 mb-4 mt-2 flex justify-center items-center">
                        <!-- Placeholder -->
                        <span class="text-5xl opacity-20">?</span>
                    </div>
                    
                    <h2 id="inspector-title" class="text-xl md:text-2xl font-bold text-medWood border-b-2 border-medWood/30 pb-2 mb-2 w-full">Select an Artifact</h2>
                    
                    <p id="inspector-date" class="text-sm text-medOlive font-bold mb-4 h-5"></p>
                    
                    <p id="inspector-desc" class="text-sm md:text-base leading-relaxed text-medWood/90 text-left w-full">
                        Hover over or tap an item in your grid to inspect its history and examine its properties.
                    </p>
                </div>

            </div>
        </div>
    </div>

    <footer class="mt-4 pb-12 text-center w-full px-4">
        <p class="text-medPistachio text-lg md:text-2xl tracking-widest glow-pistachio uppercase leading-relaxed">
            driving directive: leverage skills to become a realm force for good
        </p>
    </footer>

    <script>
        // The Artifact Database
        const artifacts = [
            { id: "Art_Fellowship", name: "Fixture of Fellowship", date: "Collected Fall 2022", desc: "A symbol of early alliances. Forged upon entry to the Academy to represent the foundational importance of a strong, unified team." },
            { id: "Art_Pres", name: "Presidential Gavel", date: "Collected Spring 2025", desc: "Wielded during the presidency of Alpha Delta Chi. Represents the successful orchestration of chapter events and the tactical management of a $30,000 treasury." },
            { id: "Art_Potion", name: "Potion of Disillusionment", date: "Collected Summer 2026", desc: "A potent brew representing complex lessons learned. Grants resistance against complacency and sharpens analytical clarity during challenging transitions." },
            { id: "Art_Cosmo", name: "Cosmonautia Telescope", date: "Collected Spring 2023", desc: "An instrument of vision marking the initial deep dive into the rigors of aerospace engineering and the mechanics of flight." },
            { id: "Art_Crystal", name: "Symphonic Crystal", date: "Collected Summer 2026", desc: "Resonates with sweeping orchestral strings and cinematic brass. A catalyst used to enhance focus during periods of intense ideation." },
            { id: "Art_RFID", name: "RFID Transmitter", date: "Collected Summer 2024", desc: "Forged during the Hana Technologies engineering apprenticeship. Its creation successfully streamlined legacy hardware and testing protocols." },
            { id: "Art_Saddle", name: "Saddle of Commuting", date: "Collected Fall 2025", desc: "Acquired during the DFW Airport consulting mission. Enhances logistical routing and transforms the environmental impact of large-scale transit." },
            { id: "Art_Shield", name: "Flying Shield & Sword", date: "Collected Spring 2026", desc: "Marks the NASA Gateways to Blue Skies mission. Represents the defense of commercial aviation via the architectural blueprints of the TWINspect drone." },
            { id: "Art_Oar", name: "Oar of Strength", date: "Collected Fall 2025", desc: "Wielded as a walk-on athlete for the Division I rowing vanguard. A physical testament to endurance, sportsmanship, and extreme teamwork." },
            { id: "Art_Spec", name: "Spectacles of Healing", date: "Collected Summer 2024", desc: "Grants clarity and precision. Essential for diagnosing inefficiencies and implementing 6S/Kaizen methods to streamline operational flowcharts." },
            { id: "Art_Pen", name: "Pen of Creativity", date: "Collected Summer 2026", desc: "A boundless conduit for journaling, creative writing, and drafting narratives. Channels inspiration into the Written Realms." },
            { id: "Art_Pencil", name: "Pencil of Arithmetic", date: "Collected Fall 2024", desc: "The foundational tool for structural analysis and finite element modeling. Required for translating abstract physics into concrete aerospace solutions." },
            { id: "Art_Key", name: "Key to the Academy", date: "Collected Fall 2022", desc: "The ceremonial key granting access to the Capstone's resources. Symbolizes the commencement of the dual-path pursuit of engineering and analytics." },
            { id: "Art_Medal", name: "Scholarly Medal", date: "Collected Spring 2026", desc: "Awarded upon the culmination of undergraduate aerospace engineering studies, marking a 3.80 GPA and National Merit Scholar standing." },
            { id: "Art_Star", name: "Ornamental Star", date: "Collected Spring 2024", desc: "A guiding light through complex academic projects and early leadership challenges. Radiates persistence." },
            { id: "Art_Stamp", name: "Stamp of Flair", date: "Collected Spring 2025", desc: "Utilized to leave a distinctive, creative mark on physical collages, multimedia endeavors, and interactive digital dashboards." },
            { id: "Art_Letter", name: "Letter of Love", date: "Collected Fall 2024", desc: "A vital tether holding correspondence and reminding the bearer of close-knit family ties and outposts across the realm." }
        ];

        function initInventory() {
            // Setup Grid
            const grid = document.getElementById('grid-container');
            
            artifacts.forEach((artifact, index) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                slot.innerHTML = `<img src="assets/${artifact.id}.png" alt="${artifact.name}" class="w-10 h-10 pixelated drop-shadow-md">`;
                
                // Add event listeners for interactivity
                slot.addEventListener('mouseenter', () => updateInspector(index, slot));
                slot.addEventListener('click', () => updateInspector(index, slot));
                
                grid.appendChild(slot);
            });

            // Fill remaining empty slots to make the grid look full (e.g., up to 24 slots)
            const emptySlotsNeeded = 24 - artifacts.length;
            for(let i=0; i < emptySlotsNeeded; i++) {
                const emptySlot = document.createElement('div');
                emptySlot.className = 'inv-slot opacity-30 cursor-default';
                grid.appendChild(emptySlot);
            }
        }

        function updateInspector(index, slotElement) {
            const artifact = artifacts[index];
            
            // Remove active class from all slots, add to current
            document.querySelectorAll('.inv-slot').forEach(s => s.classList.remove('active'));
            slotElement.classList.add('active');

            // Update Inspector Data
            document.getElementById('inspector-icon').innerHTML = `<img src="assets/${artifact.id}.png" alt="${artifact.name}" class="w-full h-full object-contain pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.4)] animate-pulse-gold">`;
            document.getElementById('inspector-title').innerText = artifact.name;
            document.getElementById('inspector-date').innerText = artifact.date;
            document.getElementById('inspector-desc').innerText = artifact.desc;
        }
    </script>
</body>
</html>
