<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madeline Beebe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medNavyTeal: '#0d1b2a', 
                        medIce: '#B9D6E5',
                        medPlum: '#4E3A53',
                        medOlive: '#698F3D',
                        medPistachio: '#D6E685',
                        medRose: '#D06D9C',
                        medCream: '#F5EDB9',
                        medWood: '#3e2723',
                        medSlate: '#868884'
                    },
                    fontFamily: { medieval: ['"MedievalSharp"', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'MedievalSharp', cursive; 
            margin: 0;
            overflow-x: hidden; 
            background-color: #4E3A53;
        }

        .glow-pistachio { text-shadow: 0 0 10px rgba(214, 230, 133, 0.8); }
        .glow-rose { text-shadow: 0 0 10px rgba(208, 109, 156, 0.8); box-shadow: 0 0 15px rgba(208, 109, 156, 0.6); }
        .glow-ice { text-shadow: 0 0 10px rgba(185, 214, 229, 0.8); }
        .box-glow { box-shadow: 0 0 30px rgba(13, 27, 42, 0.8); }
        .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
        
        .room-wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 65%;
            background: linear-gradient(to bottom, #0d1b2a, #1a2f3a);
            border-bottom: 8px solid #15242b;
            z-index: 1;
        }
        .room-floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background: linear-gradient(to bottom, #3e2723, #251613);
            z-index: 1;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.6);
        }

        .room-object {
            position: absolute;
            z-index: 30;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .room-object:hover {
            transform: scale(1.10) translateY(-5px);
            filter: drop-shadow(0 0 15px rgba(214,230,133,0.6));
        }
        .room-object span {
            opacity: 0;
            transition: opacity 0.3s;
            margin-top: 4px;
            background-color: rgba(13, 27, 42, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #D6E685;
            white-space: nowrap;
            pointer-events: none;
            color: #D6E685;
            font-size: 0.875rem;
            position: relative;
        }
        .room-object:hover span {
            opacity: 1;
        }

        .room-decor {
            position: absolute;
            pointer-events: none;
        }

        @keyframes goldPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(214,230,133,1); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(214,230,133,0); }
        }
        .animate-pulse-gold { animation: goldPulse 0.5s ease-out; }
    </style>
</head>
<body class="text-medCream min-h-screen p-4 md:p-8 flex flex-col items-center" onload="initDashboard()">

    <div id="pouch" class="fixed top-6 right-6 bg-medWood border-2 border-medPistachio text-medPistachio px-4 py-2 rounded-xl z-50 shadow-lg flex items-center gap-2 text-2xl cursor-default">
        <span>🪙</span> <span id="coin-count" class="glow-pistachio">0</span>
    </div>

    <!-- CENTERED NAME (Above Diorama) -->
    <div class="w-full text-center mt-6 md:mt-2 mb-4">
        <h1 class="text-4xl md:text-5xl text-medCream glow-ice tracking-widest uppercase">Madeline Beebe</h1>
    </div>

    <!-- MAIN DIORAMA WRAPPER -->
    <div class="relative w-full max-w-5xl mx-auto mb-8">
        
        <div class="relative w-full aspect-square md:aspect-[16/9] bg-medNavyTeal border-8 border-medOlive rounded-2xl box-glow overflow-hidden">
            
            <div class="room-wall"></div>
            <div class="room-floor"></div>

            <!-- STAGNANT PERSONA BOX (Bottom Left) -->
            <div id="persona-box" class="absolute bottom-6 left-6 z-50 bg-medNavyTeal/95 border-4 border-medPistachio p-4 rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.8)] w-64 md:w-80 cursor-default">
                <h1 class="text-lg md:text-xl text-medPistachio glow-pistachio mb-2 border-b border-medIce/30 pb-2">Magister Madeline Beebe</h1>
                <div class="grid grid-cols-2 gap-2 text-xs md:text-sm text-medCream">
                    <p><span class="text-medIce">Class:</span> Scholar</p>
                    <p><span class="text-medIce">Rank:</span> Magister</p>
                    <p class="col-span-2"><span class="text-medIce">Materia:</span> Cosmonautics & Analytics</p>
                </div>
            </div>

            <!-- RIGHT QUADRANT -->
            <img src="assets/New_Window.png" alt="Window" class="room-decor w-40 md:w-56 pixelated z-10 opacity-90" style="top: 25%; left: 68%; transform: translateX(-50%);">
            
            <a href="skills.html" class="room-object" style="bottom: 12%; right: 2%; z-index: 20;">
                <img src="assets/Bookshelf.png" alt="Bookshelf" class="w-40 md:w-56 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                <span>Skill Tree</span>
            </a>
            
            <a href="campaign.html" class="room-object" style="bottom: 5%; right: 18%; z-index: 45;">
                <img src="assets/Spellbook_Pedestal.png" alt="Spellbook" class="w-24 md:w-36 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                <span>Campaign Log</span>
            </a>

            <!-- LEFT QUADRANT -->
            <a href="map.html" class="room-object" style="top: 25%; left: 6%; z-index: 10;">
                <img src="assets/Wall_Map.png" alt="Map" class="w-24 md:w-36 pixelated drop-shadow-xl">
                <span>Overworld Map</span>
            </a>
            
            <a href="sidequests.html" class="room-object" style="top: 15%; left: 16%; z-index: 10;">
                <img src="assets/Quest_Board.png" alt="Quest Board" class="w-24 md:w-36 pixelated drop-shadow-xl">
                <span>Side Quests</span>
            </a>
            
            <a href="inventory.html" class="room-object" style="bottom: 28%; left: 22%; transform: translateX(-50%); z-index: 25;">
                <img src="assets/Wooden_Chest.png" alt="Chest" class="w-24 md:w-40 pixelated drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]">
                <span>Artifact Inventory</span>
            </a>

            <!-- CENTER QUADRANT -->
            <img src="assets/Lantern.png" alt="Lantern" class="room-decor w-10 md:w-16 pixelated z-10 animate-pulse drop-shadow-[0_0_15px_rgba(245,237,185,0.6)]" style="top: 20%; left: 38%; transform: translateX(-50%);">
            
            <img src="assets/Lantern.png" alt="Lantern" class="room-decor w-10 md:w-16 pixelated z-10 animate-pulse drop-shadow-[0_0_15px_rgba(245,237,185,0.6)]" style="top: 20%; left: 62%; transform: translateX(-50%);">

            <div class="absolute z-20 flex justify-center w-56 h-56 md:w-72 md:h-72 cursor-pointer transition-all duration-300 hover:drop-shadow-[0_0_20px_rgba(214,230,133,0.8)]" style="bottom: 25%; left: 50%; transform: translateX(-50%);" onmouseenter="toggleLevel(true)" onmouseleave="toggleLevel(false)">
                <img src="assets/Main_Avatar.png" alt="Main Avatar" class="w-full h-full object-contain pixelated drop-shadow-[0_15px_15px_rgba(0,0,0,0.6)]">
                <div id="lvl-badge" class="absolute top-4 right-8 md:top-8 md:right-12 bg-medRose text-medCream border border-medCream rounded px-2 py-0.5 text-xs md:text-sm font-bold glow-rose z-50 pointer-events-none shadow-md opacity-0 transition-opacity duration-300">
                    LVL 5
                </div>
            </div>

            <a href="academy.html" class="room-object" style="bottom: -4%; left: 50%; transform: translateX(-50%); z-index: 40;">
                <img src="assets/Heavy_Desk.png" alt="Heavy Desk" class="w-56 md:w-80 pixelated drop-shadow-[0_15px_15px_rgba(0,0,0,0.9)]">
                <span>The Academy</span>
            </a>

            <button id="hidden-coin" onclick="collectCoin(event, this)" class="absolute text-3xl md:text-4xl opacity-0 hover:opacity-100 transition-all z-[100] drop-shadow-[0_0_15px_rgba(214,230,133,0.8)]" title="A hidden coin!">
                🪙
            </button>
        </div>
    </div>

    <footer class="mt-4 pb-12 text-center w-full px-4">
        <p class="text-medPistachio text-lg md:text-2xl tracking-widest glow-pistachio uppercase leading-relaxed">
            driving directive: leverage skills to become a realm force for good.
        </p>
    </footer>

    <script>
        function toggleLevel(show) {
            const lvlBadge = document.getElementById('lvl-badge');
            if (show) {
                lvlBadge.classList.remove('opacity-0');
                lvlBadge.classList.add('opacity-100');
            } else {
                lvlBadge.classList.add('opacity-0');
                lvlBadge.classList.remove('opacity-100');
            }
        }

        function initDashboard() {
            let coins = localStorage.getItem('agencia_coins') || 0;
            document.getElementById('coin-count').innerText = coins;

            const spawnPoints = [
                { top: '25%', left: '8%' },
                { top: '65%', right: '12%' },
                { top: '45%', left: '78%' },
                { bottom: '25%', left: '30%' },
                { top: '15%', left: '45%' },
                { bottom: '15%', right: '40%' }
            ];

            const coin = document.getElementById('hidden-coin');
            const randomSpawn = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            
            if (randomSpawn.top) coin.style.top = randomSpawn.top;
            if (randomSpawn.bottom) coin.style.bottom = randomSpawn.bottom;
            if (randomSpawn.left) coin.style.left = randomSpawn.left;
            if (randomSpawn.right) coin.style.right = randomSpawn.right;
        }

        function collectCoin(event, element) {
            const pouch = document.getElementById('pouch');
            const ghostCoin = document.createElement('div');
            
            // To update to an image instead of an emoji, change this line!
            ghostCoin.innerText = '🪙';
            
            ghostCoin.style.position = 'fixed';
            ghostCoin.style.left = event.clientX + 'px';
            ghostCoin.style.top = event.clientY + 'px';
            ghostCoin.style.fontSize = window.innerWidth < 768 ? '2rem' : '3rem';
            ghostCoin.style.zIndex = '9999';
            ghostCoin.style.pointerEvents = 'none';
            ghostCoin.style.transition = 'all 0.7s cubic-bezier(0.25, 1, 0.5, 1)'; 
            document.body.appendChild(ghostCoin);
            element.style.display = 'none';

            setTimeout(() => {
                const pouchRect = pouch.getBoundingClientRect();
                ghostCoin.style.left = (pouchRect.left + 20) + 'px';
                ghostCoin.style.top = (pouchRect.top + 10) + 'px';
                ghostCoin.style.transform = 'scale(0.5)';
                ghostCoin.style.opacity = '0';
            }, 20);

            setTimeout(() => {
                ghostCoin.remove();
                let coins = parseInt(localStorage.getItem('agencia_coins') || 0) + 1;
                localStorage.setItem('agencia_coins', coins);
                document.getElementById('coin-count').innerText = coins;
                
                pouch.classList.add('animate-pulse-gold');
                setTimeout(() => pouch.classList.remove('animate-pulse-gold'), 500);
            }, 720);
        }
    </script>
</body>
</html>
